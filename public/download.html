  :root{

  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  body{

  .wrap{max-width:460px;margin:0 auto;text-align:center;}

  .logo{width:88px;height:88px;border-radius:22px;box-shadow:0 12px 30px -10px rgba(184,134,11,.45);margin-bottom:22px;}
  .brandlogo{width:172px;height:auto;display:block;margin:0 auto 10px;}
  .tagline{font-size:19px;font-weight:700;color:var(--ink);line-height:1.45;margin-bottom:8px;}
  .subline{font-size:14px;color:var(--muted);margin-bottom:30px;}

  /* concept showcase */
  .showcase{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;}
  .shot{width:108px;aspect-ratio:3/4;border-radius:18px;object-fit:cover;background:#efe7d6;
    box-shadow:0 1px 2px rgba(35,31,32,.06),0 14px 30px -14px rgba(35,31,32,.35);}
  .shot.sm{width:92px;opacity:.94;}
  .showcase-cap{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:34px;}

  /* store buttons */
  .cta-primary{display:block;background:linear-gradient(180deg,#2c2723,var(--ink));color:#fff;
    font-size:17px;font-weight:700;border-radius:16px;padding:17px;text-decoration:none;
    box-shadow:0 12px 26px -8px rgba(35,31,32,.5);margin-bottom:14px;transition:transform .12s;}
  .cta-primary:active{transform:scale(.98);}
  .badges{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;}
  .badge{display:inline-flex;align-items:center;gap:9px;background:var(--surface);color:var(--ink);
    text-decoration:none;border:1px solid var(--hair);border-radius:14px;padding:12px 18px;
    font-weight:700;font-size:13.5px;box-shadow:0 1px 2px rgba(35,31,32,.05),0 10px 24px -16px rgba(35,31,32,.3);
    transition:transform .12s;}
  .badge:active{transform:scale(.97);}
  .badge svg{width:24px;height:24px;flex:0 0 auto;}
  .badge .l{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;}
  .badge .l small{font-size:10px;font-weight:600;color:var(--muted);}
  .badge .l span{font-size:15px;}

  .hint{font-size:12px;color:var(--muted);margin-top:18px;}
  .features{display:flex;justify-content:center;gap:20px;margin:30px 0 6px;flex-wrap:wrap;}
  .feat{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px;}
  .feat b{color:var(--primary);}
  .foot{margin-top:34px;font-size:11.5px;color:var(--muted);line-height:1.9;}
  .foot a{color:var(--muted);text-decoration:none;}
  .foot a:hover{text-decoration:underline;}
  .webapp{display:inline-block;margin-top:14px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none;}
