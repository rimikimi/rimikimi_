<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  :root{ --primary:#B8860B; --gold:#E4B53A; --ink:#231f20; --muted:#8a7f6e; --rose:#e6403c; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{width:1080px;height:1512px;}           /* 5:7 */
  body{
    font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% -8%,#FFFDF9 0%,#F7EFDD 55%,#EFE3C9 100%);
    display:flex;flex-direction:column;align-items:center;
    padding:62px 64px 54px;position:relative;overflow:hidden;
  }
  body::before{content:"";position:absolute;width:640px;height:640px;left:-200px;top:640px;
    background:radial-gradient(circle,rgba(228,181,58,.22),transparent 68%);filter:blur(8px);}
  body::after{content:"";position:absolute;width:540px;height:540px;right:-170px;top:80px;
    background:radial-gradient(circle,rgba(230,64,60,.10),transparent 68%);}
  .inner{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;height:100%;}
  .inner > *{flex:none;}   /* 세로 고정 캔버스라 flex 축소 금지 — 안 그러면 로고/사진이 눌린다 */

  .pill{display:inline-flex;align-items:center;gap:11px;background:var(--ink);color:#fff;
    font-size:21px;font-weight:700;letter-spacing:.04em;padding:11px 27px;border-radius:999px;margin-bottom:16px;}
  .pill .dot{width:10px;height:10px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 4px rgba(230,64,60,.25);}

  .brandlogo{width:266px;height:auto;display:block;margin:0 auto 18px;}

  .headline{font-size:58px;font-weight:800;line-height:1.16;letter-spacing:-.03em;text-align:center;margin-bottom:12px;}
  .headline .hl{color:var(--rose);}
  .sub{font-size:27px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:26px;line-height:1.45;}

  .showcase{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:34px;}
  .frame{width:252px;aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:#efe7d6;
    box-shadow:0 3px 6px rgba(35,31,32,.08),0 34px 60px -28px rgba(35,31,32,.5);}
  .frame img{width:100%;height:100%;object-fit:cover;display:block;}
  .frame.mid{width:282px;transform:translateY(-12px);}
  /* 인물이 작게 잡힌 컷은 살짝 당겨서 (잘림 없이 상반신 비중 확보) */
  .frame.zoom img{transform:scale(1.10);transform-origin:50% 68%;}  /* 발이 잘리면 안 된다(드레스룸 프레이밍 원칙) */

  .list{width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:auto;}
  .row{display:flex;align-items:flex-start;gap:18px;background:#fff;border:1.5px solid rgba(184,134,11,.26);
    border-radius:24px;padding:17px 26px;box-shadow:0 14px 30px -22px rgba(35,31,32,.45);}
  .num{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(228,181,58,.20);
    display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:var(--primary);margin-top:2px;}
  .txt{display:flex;flex-direction:column;gap:5px;}
  .t{font-size:28px;font-weight:800;letter-spacing:-.02em;}
  .t b{color:var(--rose);}
  .d{font-size:22px;font-weight:600;color:var(--muted);line-height:1.4;}

  /* 공식 스토어 배지 — 비율/색 변형 금지, 여백 유지 (Apple/Google 브랜드 가이드) */
  .badges{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:34px;}
  .badges img{display:block;}
  .badges .apple{height:74px;width:auto;}
  .badges .play{height:98px;width:auto;}
</style>
</head>
