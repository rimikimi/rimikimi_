<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>rimikimi — 내 얼굴로 만드는 인생 프로필</title>
    <meta name="description" content="AI로 만드는 나만의 포트레이트. 카페·웨딩·스튜디오 컨셉까지." />

    <!-- 안전영역/오버스크롤 시 흰 테두리 방지 + 기종 자동 대응 -->
    <style>
      html, body { margin: 0; background: #fffdf9; min-height: 100%; }
      body { overscroll-behavior: none; }
    </style>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fffdf9" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="rimikimi" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />

    <!-- Open Graph (카톡/페북 공유 카드) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="rimikimi" />
    <meta property="og:description" content="내 얼굴로 인생 프로필 만들기 ✨" />
    <meta property="og:image" content="/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 서비스 워커: 로컬 개발 환경(localhost / 127.0.0.1)에서는
      // 등록을 건너뛰고, 이미 등록된 SW + 모든 캐시를 자동으로 해제.
      // (개발 중 옛 코드 캐싱 때문에 디버깅이 어려워지는 걸 방지)
      var __isDev =
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1" ||
        location.hostname.endsWith(".local");

      if ("serviceWorker" in navigator) {
        if (__isDev) {
          // 기존 SW 전부 해제 + 캐시 비우기
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches) {
            caches.keys().then(function (ks) {
              ks.forEach(function (k) { caches.delete(k); });
            });
          }
        } else {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("/sw.js").catch(function () {});
          });
        }
      }
    </script>
  </body>
</html>
