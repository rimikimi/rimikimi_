    <!-- 한/영 두 벌인데 hreflang 이 하나도 없었다 (2026-09-18 감사).
         언어 전환이 ?lang= 쿼리로만 되고 서버 응답엔 흔적이 없어서,
         ?lang=en 으로 들어온 영어권 사용자에게도 한국어 메타가 노출됐다.
         ⚠️ 검색엔진이 각 언어판을 크롤하려면 **각 변형이 자기 자신을 canonical**로
            가리켜야 한다 — src/i18n.js 가 렌더 언어에 맞춰 canonical·title·
            description·og:locale·html[lang] 을 함께 갈아끼운다. -->
    <link rel="alternate" hreflang="ko" href="https://rimikimi-app.vercel.app/?lang=ko" />
    <link rel="alternate" hreflang="en" href="https://rimikimi-app.vercel.app/?lang=en" />

    <!-- 폰트 — 예전엔 런타임 주입 <style> 맨 위의 @import 였다. @import 는 그 스타일시트
         파싱을 멈추고 네트워크를 기다리므로 첫 페인트가 늦어져 진입이 덜컥거렸다(특히 웹뷰).
         preconnect + display=swap 링크로 올려 렌더를 막지 않게 한다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"

    <!-- 안전영역/오버스크롤 시 흰 테두리 방지 + 기종 자동 대응 -->
    <style>
      /* 문서 자체는 절대 스크롤/바운스하지 않음 (스플래시·로그인 포함 모든 화면 공통).
         실제 스크롤은 각 화면 내부 컨테이너가 담당 → 바운스 시 검은 배경 노출 방지 */
      html, body, #root {
        margin: 0; height: 100%;
        background: #fffdf9;
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* 스플래시 애니메이션 — JS 번들 로드 전 첫 페인트부터 적용되도록 여기에 둠
         (없으면 로고가 맨 모습으로 떴다가 pop 이 걸리며 깜빡임 = FOUC) */
      .splashLogo { animation: pop .6s cubic-bezier(.34,1.56,.64,1); }
      @keyframes pop {
        0% { opacity: 0; transform: scale(.7); }
        100% { opacity: 1; transform: scale(1); }
      }
      .splashDot {
        width: 11px; height: 11px; border-radius: 3px 11px 11px 11px;
        transform: rotate(45deg); display: inline-block;
        animation: bounce 1s ease-in-out infinite;
      }
      @keyframes bounce {
        0%, 100% { transform: rotate(45deg) translateY(0); opacity: .55; }
        50% { transform: rotate(45deg) translateY(-9px); opacity: 1; }
      }
    </style>

    <script>
      // 서비스 워커: 로컬 개발 환경(localhost / 127.0.0.1)에서는
      // 등록을 건너뛰고, 이미 등록된 SW + 모든 캐시를 자동으로 해제.
      // (개발 중 옛 코드 캐싱 때문에 디버깅이 어려워지는 걸 방지)
      var __isDev =
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1" ||
        location.hostname.endsWith(".local");

      if ("serviceWorker" in navigator) {
        if (__isDev) {
          // 기존 SW 전부 해제 + 캐시 비우기
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches) {
            caches.keys().then(function (ks) {
              ks.forEach(function (k) { caches.delete(k); });
            });
          }
        } else {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("/sw.js").catch(function () {});
          });
        }
      }
    </script>
