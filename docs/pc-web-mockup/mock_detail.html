*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{--bg:#0B0B0C;--s1:#141416;--s2:#1C1C1F;--line:#27272B;--tx:#F4F4F5;--mu:#8C8C94;--ac:#E6403C}
html,body{background:var(--bg);color:var(--tx);font-family:'Pretendard',sans-serif;word-break:keep-all;width:1440px}
.wrap{width:1440px;padding:0 64px}
nav{position:sticky;top:0;z-index:5;height:76px;display:flex;align-items:center;gap:40px;padding:0 64px;background:rgba(11,11,12,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav .brandlogo{height:30px;width:auto}
nav .links{display:flex;gap:28px;font-size:16px;font-weight:600;color:var(--mu)}
nav .links b{color:var(--tx)}
nav .sp{flex:1}
.search{width:300px;height:42px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;padding:0 16px;color:var(--mu);font-size:15px;gap:10px}
.chip{height:42px;padding:0 16px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;font-size:15px;font-weight:700}
.btn{height:42px;padding:0 20px;border-radius:12px;background:var(--tx);color:#0B0B0C;display:flex;align-items:center;font-size:15px;font-weight:800}
.btn.red{background:var(--ac);color:#fff}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.ava{width:42px;height:42px;border-radius:50%;background:var(--s2);border:1px solid var(--line)}

html,body{height:900px;overflow:hidden}
.dt{display:grid;grid-template-columns:1fr 520px;gap:48px;padding:40px 64px}
.big{position:relative;height:744px;border-radius:24px;overflow:hidden;background:var(--s1)} .big img{width:100%;height:100%;object-fit:cover}
.thumbs{position:absolute;left:20px;bottom:20px;display:flex;gap:10px} .thumbs div{width:72px;height:96px;border-radius:12px;overflow:hidden;border:2px solid transparent} .thumbs div.on{border-color:#fff} .thumbs img{width:100%;height:100%;object-fit:cover}
.crumb{font-size:14px;color:var(--mu);font-weight:600}
.pn h1{margin-top:12px;font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1.12}
.tags{margin-top:14px;display:flex;gap:8px} .tags span{font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--s2);color:var(--mu)}
.box{margin-top:26px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:22px}
.box h4{font-size:15px;font-weight:800;color:var(--mu)}
.drop{margin-top:14px;display:flex;gap:16px;align-items:center} .drop .ph{width:84px;height:84px;border-radius:14px;overflow:hidden} .drop img{width:100%;height:100%;object-fit:cover}
.drop b{font-size:17px} .drop small{display:block;margin-top:4px;color:var(--mu);font-size:14px}
.seg{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .seg div{height:56px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.seg div.on{background:var(--tx);color:#0B0B0C;border-color:var(--tx)} .seg small{font-size:11px;font-weight:700;color:var(--ac)}
.make{margin-top:24px;height:64px;border-radius:16px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800}
.sim{margin-top:26px} .sim h4{font-size:15px;font-weight:800;color:var(--mu)} .simr{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px} .simr div{aspect-ratio:3/4;border-radius:12px;overflow:hidden} .simr img{width:100%;height:100%;object-fit:cover}
