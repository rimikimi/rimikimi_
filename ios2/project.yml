name: rimikimi
options:
  bundleIdPrefix: com.rimikimi
  deploymentTarget:
    # v2/SPEC.md §0: iOS 26+, Friday 방식. 네이티브 Liquid Glass 탭바·safeAreaBar 를 그대로 쓴다.
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  # 전면광고(AdMob). 1.x 는 @capacitor-community/admob 으로 넣었는데 2.0 엔 그 플러그인이
  # 없어서 광고가 아예 안 나갔다 — 구글 공식 SPM 배포판으로 다시 붙인다(오너 지시 2026-09-18).
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0

settings:
  base:
    # Friday 와 동일 — Swift 5 언어 모드 + 최소 strict-concurrency.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K6U5MWKT85
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      # xcodegen 은 Xcode GUI 템플릿과 달리 이 값을 자동으로 넣어주지 않는다 — 없으면 `#if DEBUG`
      # (DevRoutes.swift 등)가 `xcodebuild` 커맨드라인 빌드에서 통째로 컴파일에서 빠진다
      # (5주차에 dev 라우트가 전부 무반응이라 발견 — 시뮬레이터 딥링크/런치 인자 테스트가 그동안
      # 이 값 없이도 "성공"으로 보였던 건 우연이 아니라 해당 분기 자체가 항상 no-op 였기 때문일 수 있다).
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) DEBUG=1"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"

targets:
  rimikimi:
    type: application
    platform: iOS
    entitlements:
      path: rimikimi/rimikimi.entitlements
      # ⚠️ xcodegen 이 generate 때마다 이 파일을 properties 로 덮어쓴다. 필요한 키는 전부 여기에.
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: $(APS_ENVIRONMENT)
    sources:
      - path: rimikimi
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: rimikimi/Info.plist
      properties:
        CFBundleDisplayName: rimikimi
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 빈 런치스크린 = 시스템 배경색으로 즉시 그림 (플래시 없음).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # OAuth 복귀 딥링크 — Supabase Redirect URL 에 등록된 com.rimikimi.app://login-callback
        CFBundleURLTypes:
          - CFBundleURLName: com.rimikimi.app
            CFBundleURLSchemes:
              - com.rimikimi.app
        # 1.x 와 같은 문구 (사진 접근에 편집 용도 반영, 1.40).
        NSPhotoLibraryAddUsageDescription: "만든 사진과 편집한 사진을 앨범에 저장하기 위해 사용합니다."
        # 문구 정정(2026-09-19): 예전엔 "필터를 보면서"였는데, 아이폰 기본 카메라로 바뀌면서
        # (build 94, SystemCamera.swift) 촬영 중 라이브 필터 미리보기가 없어졌다 — 촬영은 먼저,
        # 필터는 찍은 뒤 편집기에서. 실제 동작과 다른 문구는 컴플라이언스 리뷰(2.3.1)에서 걸린다.
        NSCameraUsageDescription: "사진을 찍어 컨셉 사진을 만들기 위해 카메라를 사용합니다."
        # WKWebView 의 getUserMedia 는 audio:false 로 요청해도 iOS 가 마이크 권한 문구를 확인한다
        # (1.x 가 이미 물린 함정 — ios/App/App/Info.plist 참고). 없으면 카메라 웹뷰가 크래시/거부된다.
        NSMicrophoneUsageDescription: "필터 카메라를 열 때 iOS가 확인하는 항목이에요. 리미키미는 소리를 녹음하지 않아요."
        # ATT — 실행 시가 아니라 첫 생성 완료 후 1회(TrackingPrompt). 문구는 1.x 와 동일.
        NSUserTrackingUsageDescription: "맞춤형 광고를 제공하기 위해 사용돼요."
        # AdMob 앱 ID(전면광고). ⚠️ 광고 **단위** ID 가 아니라 앱 ID(`~` 구분자) — 여기에
        # 단위 ID 를 넣으면 SDK 가 실행 즉시 크래시한다. 값은 1.x `ios/App/App/Info.plist` 그대로.
        GADApplicationIdentifier: ca-app-pub-9458625554324585~5856129775
        # SKAdNetwork — iOS 광고 기여(attribution) 허용 네트워크 목록. 이게 없으면 ATT 를 거부한
        # 사용자에 대한 전환 측정이 통째로 빠져 eCPM 이 떨어진다. 1.x Info.plist 의 42개를 그대로 옮겼다.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: pwa73g5rt2.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        # 원격 푸시(FCM). APNs 토큰은 AppDelegate 가 Messaging 에 직접 넘긴다(스위즐링 끔).
        UIBackgroundModes:
          - remote-notification
        FirebaseAppDelegateProxyEnabled: false
        LSApplicationQueriesSchemes:
          - kakaokompassauth
          - kakaolink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rimikimi.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.0.0"
        # ⚠️ 이 값이 project.pbxproj 의 진짜 출처다. 빌드 번호를 pbxproj 쪽에서만 올리면
        #    다음 `xcodegen generate` 때 통째로 되돌아간다 — 실제로 어긋나 있었다(yml 96 / pbxproj 97).
        #    올릴 땐 여기를 올릴 것.
        # 2026-09-19: 97 → 98. ASC 확인 결과 97 은 한 번도 업로드된 적 없었지만(디스크의 유일한
        # 아카이브는 광고 붙기 전인 90), 이번에 컴플라이언스 FIX 5건이 들어가는 김에 번호를 새로
        # 올려 "이 빌드부터가 그 수정분"임을 명확히 한다.
        CURRENT_PROJECT_VERSION: "98"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          # ios_signing 메모: 프로파일 "rimikimi AppStore v4"(Push 포함) + 인증서 XZCYYJ2KAB
          PROVISIONING_PROFILE_SPECIFIER: "rimikimi AppStore v4"

schemes:
  rimikimi:
    build:
      targets:
        rimikimi: all
    run:
      config: Debug
    archive:
      config: Release
