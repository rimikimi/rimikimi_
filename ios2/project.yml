name: rimikimi
options:
  bundleIdPrefix: com.rimikimi
  deploymentTarget:
    # v2/SPEC.md §0: iOS 26+, Friday 방식. 네이티브 Liquid Glass 탭바·safeAreaBar 를 그대로 쓴다.
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0

settings:
  base:
    # Friday 와 동일 — Swift 5 언어 모드 + 최소 strict-concurrency.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K6U5MWKT85
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      # xcodegen 은 Xcode GUI 템플릿과 달리 이 값을 자동으로 넣어주지 않는다 — 없으면 `#if DEBUG`
      # (DevRoutes.swift 등)가 `xcodebuild` 커맨드라인 빌드에서 통째로 컴파일에서 빠진다
      # (5주차에 dev 라우트가 전부 무반응이라 발견 — 시뮬레이터 딥링크/런치 인자 테스트가 그동안
      # 이 값 없이도 "성공"으로 보였던 건 우연이 아니라 해당 분기 자체가 항상 no-op 였기 때문일 수 있다).
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) DEBUG=1"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"

targets:
  rimikimi:
    type: application
    platform: iOS
    entitlements:
      path: rimikimi/rimikimi.entitlements
      # ⚠️ xcodegen 이 generate 때마다 이 파일을 properties 로 덮어쓴다. 필요한 키는 전부 여기에.
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: $(APS_ENVIRONMENT)
    sources:
      - path: rimikimi
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseMessaging
    info:
      path: rimikimi/Info.plist
      properties:
        CFBundleDisplayName: rimikimi
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 빈 런치스크린 = 시스템 배경색으로 즉시 그림 (플래시 없음).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # OAuth 복귀 딥링크 — Supabase Redirect URL 에 등록된 com.rimikimi.app://login-callback
        CFBundleURLTypes:
          - CFBundleURLName: com.rimikimi.app
            CFBundleURLSchemes:
              - com.rimikimi.app
        # 1.x 와 같은 문구 (사진 접근에 편집 용도 반영, 1.40).
        NSPhotoLibraryAddUsageDescription: "만든 사진과 편집한 사진을 앨범에 저장하기 위해 사용합니다."
        NSCameraUsageDescription: "필터를 보면서 사진을 찍기 위해 카메라를 사용합니다."
        # WKWebView 의 getUserMedia 는 audio:false 로 요청해도 iOS 가 마이크 권한 문구를 확인한다
        # (1.x 가 이미 물린 함정 — ios/App/App/Info.plist 참고). 없으면 카메라 웹뷰가 크래시/거부된다.
        NSMicrophoneUsageDescription: "필터 카메라를 열 때 iOS가 확인하는 항목이에요. 리미키미는 소리를 녹음하지 않아요."
        # ATT — 실행 시가 아니라 첫 생성 완료 후 1회(TrackingPrompt). 문구는 1.x 와 동일.
        NSUserTrackingUsageDescription: "맞춤형 광고를 제공하기 위해 사용돼요."
        # 원격 푸시(FCM). APNs 토큰은 AppDelegate 가 Messaging 에 직접 넘긴다(스위즐링 끔).
        UIBackgroundModes:
          - remote-notification
        FirebaseAppDelegateProxyEnabled: false
        LSApplicationQueriesSchemes:
          - kakaokompassauth
          - kakaolink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rimikimi.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "91"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          # ios_signing 메모: 프로파일 "rimikimi AppStore v4"(Push 포함) + 인증서 XZCYYJ2KAB
          PROVISIONING_PROFILE_SPECIFIER: "rimikimi AppStore v4"

schemes:
  rimikimi:
    build:
      targets:
        rimikimi: all
    run:
      config: Debug
    archive:
      config: Release
